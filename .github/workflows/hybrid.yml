name: hybrid

# changes of the hybrid module, of sbml2jax (a path dependency) or of this
# workflow run its checks
on:
  push:
    branches: [develop, main]
    paths: ["hybrid/**", "sbml2jax/**", ".github/workflows/hybrid.yml"]
  pull_request:
    branches: [develop, main]
    paths: ["hybrid/**", "sbml2jax/**", ".github/workflows/hybrid.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: hybrid

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uvx ruff check
      - run: uvx ruff format --check

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: hybrid/uv.lock
      - name: Unit tests
        run: uvx --with tox-uv tox -e py3.13 -- --durations=15
